<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riches to Reality - Simulator</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            padding: 20px; 
            text-align: center; 
            margin: 0;
        }
        h1 { color: #38bdf8; font-size: 24px; }
        .card { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            margin: 20px auto; 
            max-width: 400px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        .ticker { 
            background: #334155; 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 14px; 
            color: #f1f5f9; 
            margin-bottom: 20px; 
            border-left: 4px solid #38bdf8;
        }
        button { 
            background: #22c55e; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 15px; 
            font-weight: bold;
        }
        button:active { background: #16a34a; }
        .stats { font-size: 18px; margin: 10px 0; }
    </style>
</head>
<body>

    <h1>Riches to Reality</h1>
    
    <div class="ticker" id="newsTicker">
        📰 Live News: Global markets open steady. Waiting for economic shifts...
    </div>
    
    <div class="card">
        <h3>Player Dashboard</h3>
        <div class="stats">Net Worth: <span id="balance" style="color: #4ade80;">₹10,000</span></div>
        <p style="font-size: 13px; color: #94a3b8;">Target to Win: ₹10,00,00,000</p>
        <button onclick="makeInvestment()">Make a Business/Market Move</button>
    </div>

    <script>
        let balance = 10000;
        const newsList = [
            "📰 Breaking: Fuel prices drop by 10%! Logistics and transport businesses are booming.",
            "📰 Alert: Crypto market crashes due to strict government regulations worldwide!",
            "📰 Tech Boom: AI startups are securing massive venture capital funding today.",
            "📰 Inflation rises: Central bank hikes interest rates, savings under pressure."
        ];

        function updateNews() {
            const randomIndex = Math.floor(Math.random() * newsList.length);
            document.getElementById("newsTicker").innerText = newsList[randomIndex];
        }

        function makeInvestment() {
            // Random financial outcome based on simulation logic
            let profitOrLoss = Math.floor(Math.random() * 8000) - 3000;
            balance += profitOrLoss;
            
            document.getElementById("balance").innerText = "₹" + balance.toLocaleString();
            
            if(profitOrLoss > 0) {
                alert("Success! Your decision generated a profit of ₹" + profitOrLoss);
            } else {
                alert("Market downturn! You incurred a loss of ₹" + Math.abs(profitOrLoss));
            }
        }

        // Automatically update news ticker every 12 seconds
        setInterval(updateNews, 12000);
    </script>

</body>
</html>
